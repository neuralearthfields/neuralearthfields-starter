[project]
name = "neuralearthfields-starter"
version = "0.1.0"
description = "A starter notebook for learning land cover from coordinates"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch==2.14.0",
    "numpy==2.5.3",
    "rasterio==1.5.1",
    "matplotlib==3.11.1",
    "scikit-learn==1.9.0",
    "jupyterlab==4.6.3",
    "huggingface-hub==1.30.0",
    "lightning==2.6.5",
    "lonboard==0.16.0",
    "async-geotiff[morecantile]==0.5.1",
    "obstore>=0.9.2",
    "pillow>=12.1.1",
]

[dependency-groups]
dev = [
    "nbclient>=0.11",
    "nbformat>=5.10",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["outputs", "data"]
