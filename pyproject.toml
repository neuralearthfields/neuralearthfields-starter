[project]
name = "neuralearthfields-starter"
version = "0.1.0"
description = "A starter notebook for learning land cover from coordinates"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch==2.14.0",
    "numpy==2.5.3",
    "matplotlib==3.11.1",
    "jupyterlab==4.6.3",
    "lightning==2.6.5",
    "torchmetrics==1.9.0",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["outputs", "data"]
